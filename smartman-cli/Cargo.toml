[package]
name = "smartman-cli"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/flyingbucket/SmartMan"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
arboard = "3"
inquire = "0.9.4"
ureq = { version = "3.3.0", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "3.1.1"
regex = "1.12.3"
serde_yaml = "0.9.4"
directories = "6"
shellexpand = "3"
dirs = "6.0.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
include = ["assets", "README.md", "LICENSE"]
allow-all-mirrors = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
